<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lost Tracker</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
}

header{
background:#0f4c81;
color:white;
padding:18px;
text-align:center;
}

nav{
background:#144d8c;
padding:12px;
display:flex;
justify-content:center;
gap:25px;
}

nav a{
color:white;
text-decoration:none;
font-weight:bold;
}

.container{
max-width:1100px;
margin:auto;
padding:25px;
}

.hero{
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 3px 12px rgba(0,0,0,.1);
margin-bottom:25px;
text-align:center;
}

.hero h1{
color:#0f4c81;
margin-bottom:10px;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;
margin-bottom:25px;
}

.stat{
background:white;
padding:20px;
border-radius:12px;
text-align:center;
box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.stat h2{
color:#2563eb;
font-size:32px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 3px 12px rgba(0,0,0,.08);
margin-bottom:25px;
}

.card h2{
color:#0f4c81;
margin-bottom:15px;
}

input,textarea,select{
width:100%;
padding:10px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;
}

button{
padding:10px 18px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.blue{
background:#2563eb;
color:white;
}

.green{
background:#16a34a;
color:white;
}

.red{
background:#dc2626;
color:white;
}

.orange{
background:#ea580c;
color:white;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#0f4c81;
color:white;
padding:10px;
}

td{
padding:10px;
border-bottom:1px solid #ddd;
text-align:center;
}

.bad
